<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kasate</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/chat.css">
    <link rel="stylesheet" href="css/voice.css">
    <link rel="stylesheet" href="css/history.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1 class="logo">Kasate</h1>
                <button class="new-chat-btn" id="newChatBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    New Chat
                </button>
            </div>

            <nav class="nav-tabs">
                <button class="nav-tab active" data-screen="chat">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Chat
                </button>
                <button class="nav-tab" data-screen="voice">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                        <line x1="12" y1="19" x2="12" y2="23"></line>
                        <line x1="8" y1="23" x2="16" y2="23"></line>
                    </svg>
                    Voice
                </button>
                <button class="nav-tab" data-screen="history">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"></circle>
                        <polyline points="12 6 12 12 16 14"></polyline>
                    </svg>
                    History
                </button>
            </nav>

            <div class="conversation-list" id="conversationList">
                <!-- Conversations will be populated here -->
            </div>

            <div class="sidebar-footer">
                <div class="user-info">
                    <div class="avatar">K</div>
                    <span>Kasate User</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Chat Screen -->
            <section class="screen chat-screen active" id="chatScreen">
                <div class="chat-header">
                    <h2 id="chatTitle">New Conversation</h2>
                </div>

                <div class="messages-container" id="messagesContainer">
                    <div class="welcome-message" id="welcomeMessage">
                        <div class="welcome-icon">
                            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <circle cx="12" cy="12" r="10"></circle>
                                <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                                <line x1="9" y1="9" x2="9.01" y2="9"></line>
                                <line x1="15" y1="9" x2="15.01" y2="9"></line>
                            </svg>
                        </div>
                        <h3>How can I help you today?</h3>
                        <p>Start a conversation or try one of these suggestions:</p>
                        <div class="suggestions">
                            <button class="suggestion-btn">Explain async/await in Rust</button>
                            <button class="suggestion-btn">Help me debug my code</button>
                            <button class="suggestion-btn">What is Tauri?</button>
                        </div>
                    </div>
                </div>

                <div class="input-container">
                    <div class="input-wrapper">
                        <textarea
                            id="messageInput"
                            placeholder="Type your message..."
                            rows="1"
                            autofocus
                        ></textarea>
                        <button class="send-btn" id="sendBtn" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="22" y1="2" x2="11" y2="13"></line>
                                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                            </svg>
                        </button>
                    </div>
                    <p class="input-hint">Press Enter to send, Shift+Enter for new line</p>
                </div>
            </section>

            <!-- Voice Screen -->
            <section class="screen voice-screen" id="voiceScreen">
                <div class="voice-container">
                    <div class="hal-interface">
                        <div class="hal-outer-ring">
                            <div class="hal-middle-ring">
                                <div class="hal-inner-ring">
                                    <div class="hal-eye" id="halEye">
                                        <div class="hal-pupil"></div>
                                        <div class="hal-reflection"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="hal-glow"></div>
                    </div>

                    <div class="voice-status" id="voiceStatus">
                        <p class="status-text">Press to speak</p>
                        <div class="audio-visualizer" id="audioVisualizer">
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                            <div class="bar"></div>
                        </div>
                    </div>

                    <button class="voice-btn" id="voiceBtn">
                        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                            <line x1="12" y1="19" x2="12" y2="23"></line>
                            <line x1="8" y1="23" x2="16" y2="23"></line>
                        </svg>
                    </button>

                    <div class="voice-transcript" id="voiceTranscript">
                        <p class="transcript-label">Transcript</p>
                        <p class="transcript-text" id="transcriptText">Your conversation will appear here...</p>
                    </div>
                </div>
            </section>

            <!-- History Screen -->
            <section class="screen history-screen" id="historyScreen">
                <div class="history-header">
                    <h2>Chat History</h2>
                    <div class="history-search">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>
                        <input type="text" placeholder="Search conversations..." id="historySearch">
                    </div>
                </div>

                <div class="history-list" id="historyList">
                    <!-- History items will be populated here -->
                </div>
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
